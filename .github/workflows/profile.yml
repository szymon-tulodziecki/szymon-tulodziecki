name: profile

on:
  schedule:
    # 02:00 UTC — 03:00/04:00 czasu polskiego
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile.yml"
      - ".github/3d-contrib-dragon.json"
      - ".github/scripts/**"

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  generate:
    name: generate profile assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # izometryczny kalendarz kontrybucji -> profile-3d-contrib/profile-dragon.svg
      - name: 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-contrib-dragon.json

      # SETTING_JSON przyjmuje tylko jednolity kolor tla - gradient dokladamy tutaj
      - name: Dragonize render
        run: python3 .github/scripts/dragonize-render.py profile-3d-contrib/profile-dragon.svg

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          if git diff --staged --quiet; then
            echo "brak zmian w wygenerowanych plikach"
          else
            git commit -m "chore(profile): regenerate contribution graphics"
            git push
          fi
